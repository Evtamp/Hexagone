<style>
:root{
  --bg:#ffffff;--surface:#ffffff;--surface2:#f7f5f1;--ink:#2a2118;--muted:#7d7263;--line:#e8e2d8;
  --accent:#b8720a;--accent-ink:#ffffff;--accent-soft:#f8ecd8;
  --green:#2f8a4a;--green-soft:#e1f2e6;--warn:#b3261e;--warn-soft:#fbe4e1;--blue:#2a6aa6;--blue-soft:#e3edf7;
  --radius:14px;--shadow:0 1px 2px rgba(42,33,24,.05),0 6px 18px rgba(42,33,24,.05);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
header.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-weight:750;font-size:17px;text-decoration:none;color:var(--ink);white-space:nowrap}
.brand img{width:30px;height:30px;border-radius:8px}
nav.tabs{display:flex;gap:2px;margin-left:8px;overflow-x:auto}
nav.tabs a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:550;white-space:nowrap}
nav.tabs a.on{background:var(--accent-soft);color:var(--accent)}
.sp{flex:1}
.iconbtn{background:none;border:1px solid var(--line);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;color:var(--muted);text-decoration:none}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:none;padding-bottom:env(safe-area-inset-bottom)}
nav.bottom a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;text-decoration:none;color:var(--muted);font-size:11px;font-weight:550}
nav.bottom a.on{color:var(--accent)}
.wk-t{font-size:13px;font-weight:650;color:var(--muted);margin:14px 0 6px}.wk-t:first-of-type{margin-top:0}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wk-d{background:#fff;border:1px solid var(--line);border-radius:12px;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:5px}
.wk-d.today{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}.wk-d.past{background:var(--surface2)}
.wk-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted);font-weight:650}.wk-h b{font-size:17px;color:var(--ink)}

/* ================= synchro entre appareils (Firebase, nœud « brassage ») =================
   Chaque collection est stockée en texte JSON sous brassage/<clé>. Une modification locale
   envoie seulement les collections qui ont changé ; une modification venue d'un autre appareil
   remplace la collection locale. Hors ligne, les collections modifiées sont marquées « à envoyer »
   et partent au retour du réseau, avant d'accepter la version distante. */
const SYNC_DIRTY='brassage.dirty';
const SY={on:false,state:'off',sent:{},dirty:{},first:true,t:0,pending:false,err:''};
try{SY.dirty=JSON.parse(lsGet(SYNC_DIRTY))||{}}catch(e){SY.dirty={}}
const syncKeys=()=>Object.keys(empty()).filter(k=>k!=='v');
syncKeys().forEach(k=>{SY.sent[k]=JSON.stringify(S[k]===undefined?empty()[k]:S[k])});
function syncSaveDirty(){try{localStorage.setItem(SYNC_DIRTY,JSON.stringify(SY.dirty))}catch(e){}}
function syncPush(){syncKeys().forEach(k=>{const j=JSON.stringify(S[k]===undefined?empty()[k]:S[k]);if(SY.sent[k]!==j){SY.dirty[k]=1;SY.sent[k]=j}});syncSaveDirty();
  if(!SY.on||SY.first)return;clearTimeout(SY.t);SY.t=setTimeout(syncFlush,300)}
function syncFlush(){if(!SY.on)return;const C=window.CLOUD;Object.keys(SY.dirty).forEach(k=>{const j=SY.sent[k];
  C.set('brassage/'+k,j).then(()=>{if(SY.sent[k]===j){delete SY.dirty[k];syncSaveDirty()}syncStatus('ok')}).catch(e=>{SY.err=String(e&&e.code||e);syncStatus('err')})})}
function syncBusy(){const a=document.activeElement;return (typeof dlg!=='undefined'&&dlg&&dlg.open)||(a&&a.matches&&a.matches('#app input,#app textarea,#app select'))||!!DND}
function syncRender(){if(syncBusy()){SY.pending=true;return}SY.pending=false;render()}
setInterval(()=>{if(SY.pending&&!syncBusy())syncRender()},800);
function syncStatus(st){SY.state=st;const el=$('#syncSt');if(el)el.innerHTML=syncTxt();const d=$('#syncDot');if(d)d.className='sync-dot '+st}
const syncTxt=()=>({off:'Synchronisation non disponible (fichier ouvert hors du site, ou pas de réseau au démarrage). Les données restent sur cet appareil.',wait:'Connexion à la synchronisation…',ok:'Synchronisée : tes données sont les mêmes sur tous tes appareils.',err:'Synchronisation en échec ('+esc(SY.err)+'). Les modifications sont gardées sur cet appareil et repartiront plus tard.',offline:'Hors ligne : les modifications partiront au retour du réseau.'})[SY.state]||'';
window.cloudReady=()=>{const C=window.CLOUD;SY.on=true;syncStatus('wait');
  C.onConnected(c=>{if(SY.state!=='err')syncStatus(c?'ok':'offline');if(c&&!SY.first)syncFlush()});
  C.listen('brassage',val=>{val=val||{};let changed=false;
    if(SY.first){SY.first=false;const remoteEmpty=!syncKeys().some(k=>val[k]!=null);
      if(remoteEmpty){syncKeys().forEach(k=>SY.dirty[k]=1)}  // premier appareil : il envoie tout
      syncKeys().forEach(k=>{if(remoteEmpty||SY.dirty[k]||val[k]==null)return;let v;try{v=JSON.parse(val[k])}catch(e){return}
        if(JSON.stringify(S[k])!==val[k]){S[k]=v;changed=true}SY.sent[k]=val[k]});
      try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncSaveDirty();syncFlush();if(changed)syncRender();syncStatus('ok');return}
    syncKeys().forEach(k=>{if(val[k]==null||val[k]===SY.sent[k])return;let v;try{v=JSON.parse(val[k])}catch(e){return}
      S[k]=v;SY.sent[k]=val[k];delete SY.dirty[k];changed=true});
    if(changed){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}syncSaveDirty();syncRender()}},
    e=>{SY.err=String(e&&e.code||e);syncStatus('err')})};
window.cloudFailed=e=>{SY.err=String(e&&e.code||e||'');syncStatus('off')};

function newRecipe(){const sys=systems()[0];return{id:uid(),name:'',style:'',systemId:sys?.id||'',volume:sys?num(sys.volume)||20:20,efficiency:sys?num(sys.efficiency)||72:72,boil:sys?num(sys.boil)||60:60,
  malts:[],hops:[],yeast:{name:'',qty:1,unit:'sachet',att:''},others:[],mash:{method:'sparge',ratio:3,sparge:78,steps:[{name:'Empâtage',temp:67,min:60},{name:'Mash-out',temp:78,min:10}]},
  ferm:[{name:'Fermentation primaire',temp:19,days:10},{name:'Garde froide',temp:2,days:3}],carb:2.4,packTemp:20,notes:''}}
function calc(r){
  const sys=byId('equipment',r.systemId)||{};
  const V=num(r.volume)||20,eff=num(r.efficiency)||72,boil=num(r.boil)||60;
  let pts=0,mcu=0,kg=0;
  (r.malts||[]).forEach(m=>{const k=num(m.kg);const ext=m.extract===''||m.extract==null?78:num(m.extract);const sugar=ext>=90||/sucre|dextrose|miel|candi|sirop/i.test(m.name);
    if(!sugar)kg+=k;pts+=k*ext/100*384*(sugar?1:eff/100);const L=(num(m.ebc)*0.508+0.76)/1.3546;mcu+=k*2.20462*L/(V*0.264172)});
  const og=V>0?1+pts/V/1000:1;
  const att=num(r.yeast?.att)||75;const fg=1+(og-1)*(1-att/100);const abv=abvHx(og,fg);
  const srm=mcu>0?1.4922*Math.pow(mcu,0.6859):0;const ebc=srm*1.97;
  let ibu=0;(r.hops||[]).forEach(h=>{if(h.use==='dry')return;const g=num(h.g),aa=num(h.aa)/100;let t,f=1;
    if(h.use==='fwh'){t=boil;f=1.1}else if(h.use==='boil')t=Math.min(num(h.time),boil);else{t=Math.max(5,Math.min(num(h.time)||10,30));f=0.5}
    ibu+=1.65*Math.pow(0.000125,og-1)*(1-Math.exp(-0.04*t))/4.15*aa*g*1000/V*f});
  const evap=num(sys.evap)||3,loss=sys.loss!=null&&sys.loss!==''?num(sys.loss):1,absorb=0.8;
  const preboil=V+loss+evap*boil/60;
  const biab=r.mash?.method==='biab';
  const mashWater=biab?preboil+kg*absorb:kg*(num(r.mash?.ratio)||3);
  const sparge=biab?0:Math.max(0,preboil+kg*absorb-mashWater);
  const t1=num(r.mash?.steps?.[0]?.temp)||67;const ratio=kg>0?mashWater/kg:3;
  const strike=kg>0?t1+0.41/ratio*(t1-20):t1;
  const hopsG=(r.hops||[]).reduce((s,h)=>s+num(h.g),0);
  return{og,fg,abv,ibu,ebc,kg,preboil,mashWater,sparge,strike,att,V,boil,hopsG,bugu:og>1?ibu/((og-1)*1000):0}}
function ebcColor(ebc){const srm=ebc/1.97;const T=[[2,'#f8e08b'],[3,'#f3d36b'],[4,'#ecc552'],[6,'#e0a72b'],[8,'#d58f1b'],[10,'#c47a17'],[13,'#b0621a'],[17,'#94491a'],[20,'#7d3a17'],[24,'#652d14'],[30,'#4a2010'],[35,'#36170c'],[40,'#251009']];
  for(const [s,c] of T)if(srm<=s)return c;return '#1a0b06'}
function carbSugar(vol,tempC,liters){const F=tempC*9/5+32;const resid=3.0378-0.050062*F+0.00026555*F*F;const gl=Math.max(0,(vol-resid)*3.82);return{gl,g:gl*liters,dextrose:gl*liters*1.05,resid}}

function brewDates(b){const r=b.recipe||{};let d=b.date;const steps=(r.ferm||[]).map(f=>{const s={...f,start:d};d=addDays(d,num(f.days));s.end=d;return s});
  const dry=(r.hops||[]).filter(h=>h.use==='dry').map(h=>({...h,date:addDays(b.date,num(h.time))}));
  return{brew:b.date,steps,fermEnd:d,dry}}
function brewStatus(b){if(b.status==='done')return'done';if(b.status==='packaged')return today()>=b.readyDate?'ready':'conditioning';if(b.status==='fermenting')return'fermenting';return b.date<=today()?'brewday':'planned'}

const PHASES=[['ferm','Fermentation','acc'],['dh','Dry hop','acc'],['garde','Garde','blue'],['topack','Terminée','warn']];
function gardeStep(b){return (b.recipe?.ferm||[]).find(x=>/garde|cold|lager|maturation/i.test(x.name||''))}
function fermPhase(b){const d=brewDates(b),t=today();
  if(b.phase&&b.phase.k){const P=PHASES.find(p=>p[0]===b.phase.k)||PHASES[0],since=b.phase.since||t;
    if(P[0]==='topack')return{k:'topack',label:'À conditionner',cls:'warn',txt:`Cuve terminée le ${fD(since)} : contrôle la densité puis conditionne`,end:since,d,manual:true};
    const g=gardeStep(b),gd=P[0]==='garde'&&g?num(g.days):0;
    return{k:P[0],label:P[1],cls:P[2],txt:`${P[1]} depuis le ${fD(since)}${P[0]==='garde'&&g?' à '+fN(num(g.temp))+' °C'+(gd?', fin prévue le '+fD(addDays(since,gd)):''):''}`,end:gd?addDays(since,gd):'',d,manual:true}}
  if(t>=d.fermEnd)return{k:'topack',label:'À conditionner',cls:'warn',txt:`Cuve terminée le ${fD(d.fermEnd)} : contrôle la densité puis conditionne`,end:d.fermEnd,d};
  const i=d.steps.findIndex(s=>t>=s.start&&t<s.end);const s=d.steps[Math.max(0,i)]||{name:'Fermentation',temp:'',end:d.fermEnd};
  const garde=/garde|cold|lager|maturation/i.test(s.name||'');
  return{k:garde?'garde':'ferm',label:s.name||'Fermentation',cls:garde?'blue':'acc',txt:`${esc(s.name||'Fermentation')}${num(s.temp)||s.temp===0?' à '+fN(num(s.temp))+' °C':''} jusqu'au ${fD(s.end)}`,end:s.end,d}}

function findIng(name){const n=norm(name);return S.ingredients.find(i=>norm(i.name)===n)}
function conv(q,from,to){if(from===to)return q;const m={'kg>g':1000,'g>kg':.001,'L>mL':1000,'mL>L':.001};return m[from+'>'+to]!=null?q*m[from+'>'+to]:null}
function needsOf(r,scale=1){const L=[];(r.malts||[]).forEach(m=>m.name&&L.push({name:m.name,qty:num(m.kg)*scale,unit:'kg',fam:'Malts'}));
  (r.hops||[]).forEach(h=>h.name&&L.push({name:h.name,qty:num(h.g)*scale,unit:'g',fam:'Houblons'}));
  if(r.yeast?.name)L.push({name:r.yeast.name,qty:Math.ceil(num(r.yeast.qty)*scale*100)/100,unit:r.yeast.unit||'sachet',fam:'Levures'});
  (r.others||[]).forEach(o=>o.name&&L.push({name:o.name,qty:num(o.qty)*scale,unit:o.unit||'g',fam:'Autres'}));
  const m={};L.forEach(x=>{const k=norm(x.name)+'|'+x.unit;if(m[k])m[k].qty+=x.qty;else m[k]={...x}});return Object.values(m)}
function check(needs){return needs.map(n=>{const it=findIng(n.name);let have=0;if(it){const c=conv(num(it.qty),it.unit,n.unit);have=c==null?0:c}return{...n,have,missing:Math.max(0,n.qty-have),found:!!it}})}
function deduct(b){needsOf(b.recipe).forEach(n=>{const it=findIng(n.name);if(!it)return;const c=conv(n.qty,n.unit,it.unit);if(c==null)return;it.qty=Math.max(0,num(it.qty)-c);logMove(it.name,-c,it.unit,'Brassin '+b.lot)});b.deducted=true}

function brewSteps(b,c){const r=b.recipe,st=[];const sparge=r.mash?.method!=='biab';

function brewFerm(b,c,d){const rd=(b.readings||[]).slice().sort((a,x)=>a.date<x.date?-1:1);const og=num(b.og)||c.og;const cur=lastSg(b);

function chart(b,og,fg){const rd=(b.readings||[]).filter(x=>num(x.sg)>0).sort((a,x)=>a.date<x.date?-1:1);const W=560,H=220,P=34;

   <text x="${P}" y="${H-8}" font-size="10" fill="#7d7263">J0</text><text x="${W-10}" y="${H-8}" font-size="10" text-anchor="end" fill="#7d7263">J${days}</text></svg>`}
function brewCond(b,c){const r=b.recipe;const vol=num(b.packVolume)||num(b.volMeasured)||num(b.volume);const cs=carbSugar(num(r.carb)||2.4,num(r.packTemp)||20,vol);

V.brassins.after=()=>{const f=()=>{const v=num($('#pkVol')?.value),co=num($('#pkCo2')?.value),t=num($('#pkT')?.value);if(!$('#pkCalc'))return;const cs=carbSugar(co,t,v);

function brewCal(b,d){const ev=[{d:b.date,t:'Brassage'}];d.steps.forEach(s=>ev.push({d:s.start,t:s.name+' ('+fN(num(s.temp))+' °C)'}));d.dry.forEach(x=>ev.push({d:x.date,t:`Dry hop ${fN(num(x.g))} g ${x.name}`}));ev.push({d:d.fermEnd,t:'Fin de fermentation → conditionnement'});

   <div class="card"><h2 style="margin-bottom:10px">Informations</h2><div class="fr"><label class="f">Nom de la recette<input data-k="name" value="${esc(r.name)}" placeholder="ex. Super Nièvre"></label><label class="f">Style<input list="dl-styles" data-k="style" value="${esc(r.style)}" placeholder="Choisir ou saisir"></label></div>
    <div class="fr" style="margin-top:10px"><label class="f">Installation<select data-k="systemId">${opt([['','— aucune —'],...systems().map(s=>[s.id,s.name])],r.systemId)}</select></label><label class="f">Volume en fermenteur (L)<input inputmode="decimal" data-k="volume" value="${esc(r.volume)}"></label><label class="f">Rendement (%)<input inputmode="decimal" data-k="efficiency" value="${esc(r.efficiency)}"></label><label class="f">Ébullition (min)<input inputmode="numeric" data-k="boil" value="${esc(r.boil)}"></label></div></div>

    <div class="small muted" style="margin-top:8px">Ébullition : minutes avant la fin. Dry hop : jour après le brassage.</div></div>
   <div class="card sec"><h2 style="margin-bottom:10px">Levure</h2><div class="fr"><label class="f">Nom<input list="dl-yeasts" data-k="yeast.name" value="${esc(r.yeast.name)}"></label><label class="f">Quantité<input inputmode="decimal" data-k="yeast.qty" value="${esc(r.yeast.qty)}"></label><label class="f">Unité<select data-k="yeast.unit">${opt(['sachet','g','mL'],r.yeast.unit)}</select></label><label class="f">Atténuation (%)<input inputmode="decimal" data-k="yeast.att" value="${esc(r.yeast.att)}" placeholder="75"></label></div><div class="small muted" id="attNote" style="margin-top:8px"></div></div>

   <div class="card sec"><h2 style="margin-bottom:10px">Empâtage</h2><div class="fr"><label class="f">Méthode<select data-k="mash.method">${opt([['sparge','Avec rinçage des drêches'],['biab','Sans rinçage (BIAB, tout-en-un)']],r.mash.method)}</select></label><label class="f">Ratio eau/grain (L/kg)<input inputmode="decimal" data-k="mash.ratio" value="${esc(r.mash.ratio)}"></label><label class="f">Eau de rinçage (°C)<input inputmode="decimal" data-k="mash.sparge" value="${esc(r.mash.sparge)}"></label></div>
    <div class="line l-mash lh" style="margin-top:10px"><span>Palier</span><span>°C</span><span>min</span><span></span></div><div class="lines">${r.mash.steps.map(mash).join('')}</div><button class="btn sm" data-act="add" data-list="mash.steps" style="margin-top:8px">+ Ajouter un palier</button><div class="note" id="waterNote" style="margin-top:10px"></div></div>

  </div>
  <div class="panel"><div class="card"><h2 style="margin-bottom:10px">Résultat</h2><div class="stats" id="stats"></div><div class="swatch" id="swatch"></div><div class="small muted" id="swatchTxt" style="margin-top:4px"></div><div id="stockChk" style="margin-top:12px"></div></div></div></div>
  <datalist id="dl-malts">${LIB.malts.map(m=>`<option value="${esc(m[0])}">`).join('')}${S.ingredients.filter(i=>i.family==='Malts').map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>
  <datalist id="dl-hops">${LIB.hops.map(m=>`<option value="${esc(m[0])}">`).join('')}${S.ingredients.filter(i=>i.family==='Houblons').map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>
  <datalist id="dl-yeasts">${LIB.yeasts.map(m=>`<option value="${esc(m[0])}">`).join('')}${S.ingredients.filter(i=>i.family==='Levures').map(i=>`<option value="${esc(i.name)}">`).join('')}</datalist>

function setPath(o,path,v){const k=path.split('.');let x=o;for(let i=0;i<k.length-1;i++)x=x[k[i]];x[k[k.length-1]]=v}
function getPath(o,path){return path.split('.').reduce((x,k)=>x==null?x:x[k],o)}
function updStats(){const r=ui.draft;if(!r||!$('#stats'))return;const c=calc(r);
  $('#stats').innerHTML=`<div class="stat"><b>${sg(c.og)}</b><span>Densité initiale</span></div><div class="stat"><b>${sg(c.fg)}</b><span>Densité finale</span></div><div class="stat"><b>${fx(c.abv)} %</b><span>Alcool</span></div><div class="stat"><b>${Math.round(c.ibu)}</b><span>IBU (Tinseth)</span></div><div class="stat"><b>${Math.round(c.ebc)}</b><span>EBC</span></div><div class="stat"><b>${fx(c.bugu,2)}</b><span>Ratio BU/GU</span></div>`;
  $('#swatch').style.background=ebcColor(c.ebc);$('#swatchTxt').textContent=c.ebc<8?'Très pâle':c.ebc<16?'Dorée':c.ebc<30?'Ambrée claire':c.ebc<50?'Ambrée':c.ebc<80?'Brune':'Noire';
  $('#kgTot').textContent=fN(c.kg)+' kg de grain';$('#ibuTot').textContent=Math.round(c.ibu)+' IBU au total';
  $('#attNote').textContent=`Atténuation retenue : ${Math.round(c.att)} % (palier principal à ${fx(num(r.mash.steps[0]?.temp)||67)} °C : plus bas = bière plus sèche, plus haut = plus de corps).`;
  $('#waterNote').innerHTML=`Eau d'empâtage <b>${fx(c.mashWater)} L à ${fx(c.strike)} °C</b> · rinçage <b>${fx(c.sparge)} L</b> · avant ébullition <b>${fx(c.preboil)} L</b>`;
  const cs=carbSugar(num(r.carb)||2.4,num(r.packTemp)||20,c.V);$('#carbNote').innerHTML=`${fN(num(r.carb)||2.4)} volumes de CO₂ : <b>${Math.round(cs.g)} g de sucre blanc</b> pour ${fN(c.V)} L (${fx(cs.gl)} g/L) ou ${Math.round(cs.dextrose)} g de dextrose ; en fût : ${fx(Math.max(0,((num(r.carb)||2.4)-1)*0.75))} bar à 4 °C.`;
  const ch=check(needsOf(r)).filter(x=>x.missing>1e-6);
  $('#stockChk').innerHTML=!needsOf(r).length?'':ch.length?`<div class="note warn"><b>Manque au grenier :</b><br>${ch.map(x=>`${esc(x.name)} : ${fN(x.missing)} ${esc(x.unit)}`).join('<br>')}</div>`:'<div class="note ok">Le grenier couvre cette recette.</div>'}
V.recettes.after=()=>{if(R.a!=='edit'||!ui.draft)return;updStats();
  $('#app').oninput=$('#app').onchange=e=>{const k=e.target.dataset.k;if(!k)return;const r=ui.draft;setPath(r,k,e.target.value);
    // auto-remplissage depuis la bibliothèque
    const m=k.match(/^(malts|hops)\.(\d+)\.name$/);if(m&&e.type==='change'){const lib=m[1]==='malts'?LIB.malts:LIB.hops;const hit=lib.find(x=>norm(x[0])===norm(e.target.value));const st=findIng(e.target.value);const line=r[m[1]][+m[2]];
      if(m[1]==='malts'){const ebc=st&&st.ebc!==''&&st.ebc!=null?st.ebc:hit?.[1];const ex=st&&st.extract?st.extract:hit?.[2];if(ebc!=null&&line.ebc==='')line.ebc=ebc;if(ex!=null&&line.extract==='')line.extract=ex}
      else{const aa=st&&st.aa?st.aa:hit?.[1];if(aa!=null&&line.aa==='')line.aa=aa}render();return}
    if(k==='yeast.name'&&e.type==='change'){const hit=LIB.yeasts.find(x=>norm(x[0])===norm(e.target.value));if(hit&&!r.yeast.att){r.yeast.att=hit[1];render();return}}
    if(k==='systemId'&&e.type==='change'){const s=byId('equipment',r.systemId);if(s){r.volume=s.volume||r.volume;r.efficiency=s.efficiency||r.efficiency;r.boil=s.boil||r.boil;render();return}}
    if(/hops\.\d+\.use/.test(k)&&e.type==='change'){render();return}
    updStats()}};
function saveDraft(){const r=ui.draft;if(!r.name.trim()){toast('Donne un nom à la recette');return false}
  const clean=JSON.parse(JSON.stringify(r));delete clean._for;
  ['malts','hops','others'].forEach(k=>clean[k]=clean[k].filter(x=>String(x.name||'').trim()));
  const i=S.recipes.findIndex(x=>x.id===clean.id);if(i>=0)S.recipes[i]=clean;else S.recipes.push(clean);save();ui.draft=null;return clean}

  </div><div><h2 style="margin-bottom:10px">Que puis-je brasser ?</h2>
   ${can.length?`<div class="rows">${can.sort((a,b)=>a.miss.length-b.miss.length).map(({r,miss})=>`<div class="row click" data-href="#/recettes/edit/${r.id}"><div class="main"><b>${esc(r.name)}</b><span class="small muted">${miss.length?'Manque : '+miss.slice(0,3).map(x=>esc(x.name)).join(', ')+(miss.length>3?'…':''):'Tout est au grenier'}</span></div>${miss.length?`<button class="btn sm" data-act="toShop" data-id="${r.id}">+ courses</button>`:'<span class="badge ok">Brassable</span>'}</div>`).join('')}</div>`:emptyBox('Aucune recette','Crée une recette pour savoir si tu peux la brasser.')}</div></div>`};

const TOOL_RUN={
 alcool:g=>{const di=g('og'),df=g('fg');if(!(di>1)||!df)return '';const Pi=platoDC(di),Pf=platoDC(df);const AA=(1-Pf/Pi)*100,ER=0.1808*Pi+0.8192*Pf,AR=(1-ER/Pi)*100;const pM=(Pi-ER)/(2.0665-0.010665*Pi),pV=pM*df/0.791;
   return `<div class="res">${fx(abvHx(di,df),2)} %</div><div class="muted">ABV : 133 × (DI − DF) / DI</div><table class="tbl" style="margin-top:8px"><tr><td>°Plato initial</td><td class="n">${fx(Pi)} °P</td></tr><tr><td>°Plato final</td><td class="n">${fx(Pf)} °P</td></tr><tr><td>Atténuation apparente</td><td class="n">${fx(AA)} %</td></tr><tr><td>Extrait réel</td><td class="n">${fx(ER,2)} °P</td></tr><tr><td>Atténuation réelle</td><td class="n">${fx(AR)} %</td></tr><tr><td>% masse alcool</td><td class="n">${fx(pM,2)} %</td></tr><tr><td>% vol. alcool</td><td class="n">${fx(pV,2)} %</td></tr></table>`},
 ibu:g=>{const v=g('v'),bg=g('bg'),gr=g('g'),aa=g('aa')/100,m=g('min');const u=1.65*Math.pow(0.000125,bg-1)*(1-Math.exp(-0.04*m))/4.15;const ibu=v?u*aa*gr*1000/v:0;return `<div class="res">${Math.round(ibu)} IBU</div><div class="muted">utilisation ${fx(u*100)} % · un dry hop ne compte pas</div>`},
 ebc:g=>{const v=g('v');let mcu=0;[1,2,3].forEach(i=>{const k=g('k'+i),e=g('e'+i);const L=(e*0.508+0.76)/1.3546;if(v)mcu+=k*2.20462*L/(v*0.264172)});const ebc=mcu>0?1.4922*Math.pow(mcu,0.6859)*1.97:0;return `<div class="tool-row"><div><div class="res">${Math.round(ebc)} EBC</div></div><div class="swatch" style="background:${ebcColor(ebc)}"></div></div>`},
 empatage:g=>{const kg=g('kg'),r=g('r'),tm=g('tm'),tg=g('tg');const tw=r?tm+0.41/r*(tm-tg):0;return `<div class="res">${fx(tw)} °C</div><div class="muted">eau d'empâtage · ${fx(kg*r)} L</div>`},
 dilution:g=>{const sv=g('sg'),v=g('v'),tg=g('tg');const add=tg>1?v*(sv-1)/(tg-1)-v:0;return add>=0?`<div class="res">${fx(add)} L</div><div class="muted">d'eau à ajouter</div>`:`<div class="res">${fx(-add)} L</div><div class="muted">à évaporer</div>`},
 densimetre:g=>{const sv=g('sg'),T=g('t')*9/5+32,C=g('c')*9/5+32;const k=x=>1.00130346-0.000134722124*x+0.00000204052596*x*x-0.00000000232820948*x*x*x;const corr=sv*k(T)/k(C);
   const bi=g('bi'),bf=g('bf'),w=1.04;const ogR=bi?1+(bi/w)/(258.6-((bi/w)/258.2)*227.1):0;const fgR=bi&&bf?1.0000-0.0044993*bi/w+0.011774*bf/w+0.00027581*(bi/w)**2-0.0012717*(bf/w)**2-0.0000072800*(bi/w)**3+0.000063293*(bf/w)**3:0;
   return `<div class="res">${sg(corr)}</div><div class="muted">densité corrigée</div>${bi?`<table class="tbl" style="margin-top:8px"><tr><td>Réfracto : DI</td><td class="n">${sg(ogR)}</td></tr><tr><td>Réfracto : DF</td><td class="n">${fgR?sg(fgR):'—'}</td></tr>${fgR?`<tr><td>Alcool</td><td class="n">${fx(abvHx(ogR,fgR),2)} %</td></tr>`:''}</table>`:''}`},
 levure:g=>{const og=g('og'),v=g('v'),via=g('via')/100,rate=g('type')||0.75;const need=rate*v*1000*ogToPlato(og)/1000;const per=100*via;const n=per?Math.ceil(need/per):0;return `<div class="res">${Math.round(need)} milliards</div><div class="muted">de cellules · ${n} sachet(s) sec de 11 g</div>`},
 carbo:g=>{const cs=carbSugar(g('co'),g('t'),g('v'));return `<div class="res">${Math.round(cs.g)} g</div><div class="muted">de sucre blanc (${fx(cs.gl)} g/L)</div><table class="tbl" style="margin-top:8px"><tr><td>Dextrose</td><td class="n">${Math.round(cs.dextrose)} g</td></tr><tr><td>Miel</td><td class="n">${Math.round(cs.g*1.25)} g</td></tr><tr><td>Extrait de malt sec</td><td class="n">${Math.round(cs.g*1.47)} g</td></tr><tr><td>En fût, CO₂ à 4 °C</td><td class="n">${fx(Math.max(0,(g('co')-1)*0.75))} bar</td></tr></table>`}};

const HX_SCHEMA={malt:[['pilsen','Pilsen','kg'],['pale_ale','Pale Ale','kg'],['ble','Blé','kg'],['acide','Malt Acide','kg'],['flocon_orge',"Flocon d'orge",'kg'],['flocon_mais','Flocon de Maïs','kg'],['crystal240','Crystal 240','kg']],
 houblon:[['magnum','Magnum','kg'],['strisselpalt','Strisselpalt','kg'],['centennial','Centennial','kg'],['simcoe','Simcoe','kg'],['amarillo','Amarillo','kg'],['mandarina','Mandarina Bavaria','kg']],
 sel:[['gypse','Sulfate de Calcium (CaSO₄)','g'],['chlorure_ca','Chlorure de Ca','g'],['sulfate_mg','Sulfate de Mg','g'],['acide_lact','Acide lactique','ml'],['bicarbonate','Bicarbonate de Na','g']],
 levure:[['s04','S-04','pqt'],['bry97','BRY-97','pqt'],['nottingham','Nottingham','pqt'],['k97','K-97','pqt']],autre:[]};
const HX_DEF={pilsen:[3.5,81],pale_ale:[6,80],ble:[4,83],acide:[4,75],flocon_orge:[3,70],flocon_mais:[2,80],crystal240:[240,72],magnum:[13],strisselpalt:[2.5],centennial:[10],simcoe:[13],amarillo:[9],mandarina:[8.5]};
const HX_FAM={malt:'Malts',houblon:'Houblons',levure:'Levures',sel:'Autres',autre:'Autres'};
function hxUnit(u){u=String(u||'').trim();const l=u.toLowerCase();return {kg:'kg',g:'g',l:'L',ml:'mL',pqt:'sachet',sachet:'sachet',paquet:'sachet'}[l]||(UNITS.includes(u)?u:'unité')}
function hexagoneMP(j){
  const d=j&&j.mp;if(!d||typeof d!=='object')return null;
  const del=new Set(Object.keys(d._deleted||{}));const raw=[];
  Object.entries(HX_SCHEMA).forEach(([cat,list])=>list.forEach(([id,name,unit])=>{if(!del.has(id))raw.push({id,cat,name,unit})}));
  const known=new Set(raw.map(x=>x.id));
  Object.entries(d).forEach(([k,m])=>{if(!k.startsWith('meta_'))return;const id=k.slice(5);if(known.has(id)||del.has(id)||!m||!HX_FAM[m.cat])return;raw.push({id,cat:m.cat,name:m.name||id,unit:m.unit||'kg'})});
  const out=new Map();
  raw.forEach(r=>{
    const g=f=>d[f+r.id];let unit=hxUnit(r.unit),qty=num(d[r.id]),low=num(g('low_'));
    const fam=HX_FAM[r.cat];
    if(fam==='Houblons'&&unit==='kg'){unit='g';qty=qty*1000;low=low*1000}
    const key=norm(r.name)+'|'+unit;
    const lot=String(g('lot_')||'').trim();
    if(out.has(key)){const o=out.get(key);o.qty+=qty;if(lot&&!o.lot.split(', ').includes(lot))o.lot=o.lot?o.lot+', '+lot:lot;return}
    const lib=fam==='Malts'?LIB.malts.find(x=>norm(x[0])===norm(r.name)):fam==='Houblons'?LIB.hops.find(x=>norm(x[0])===norm(r.name)):null;
    const aa=num(g('aa_')),ext=num(g('rendement_'));
    out.set(key,{name:r.name,family:fam,qty,unit,alert:low,
      ebc:fam==='Malts'?(lib?lib[1]:HX_DEF[r.id]?HX_DEF[r.id][0]:''):'',extract:fam==='Malts'?(ext||(lib?lib[2]:HX_DEF[r.id]?HX_DEF[r.id][1]:'')):'',aa:fam==='Houblons'?(aa||(lib?lib[1]:HX_DEF[r.id]?HX_DEF[r.id][0]:'')):'',
      supplier:'',lot,ddm:'',price:num(g('price_'))||'',hx:r.id});
  });
  return [...out.values()].map(o=>({...o,qty:Math.round(o.qty*1000)/1000}));
}
function importHexagoneMP(items){
  let add=0,upd=0;
  items.forEach(o=>{const ex=S.ingredients.find(i=>norm(i.name)===norm(o.name)&&i.unit===o.unit);
    if(ex){if(num(ex.qty)!==o.qty)logMove(ex.name,o.qty-num(ex.qty),ex.unit,'Import Hexagone');
      Object.assign(ex,{qty:o.qty,alert:o.alert||ex.alert,lot:o.lot||ex.lot||'',price:o.price||ex.price||'',hx:o.hx,family:o.family,
        ebc:ex.ebc!==''&&ex.ebc!=null?ex.ebc:o.ebc,extract:ex.extract!==''&&ex.extract!=null?ex.extract:o.extract,aa:o.aa||ex.aa});upd++}
    else{S.ingredients.push({id:uid(),...o});if(o.qty)logMove(o.name,o.qty,o.unit,'Import Hexagone');add++}});
  save();return {add,upd};
}

/* ---------- Import des recettes d'Hexagone ---------- */
function hxLook(name){const n=norm(name);return S.ingredients.find(i=>norm(i.name)===n)}
function hxMalt(l){const g=hxLook(l.name)||{};const lib=LIB.malts.find(x=>norm(x[0])===norm(l.name));
  const id=(HX_SCHEMA.malt.find(x=>norm(x[1])===norm(l.name))||[])[0];const def=id?HX_DEF[id]:null;
  const sugar=/sucre|dextrose|miel|candi|sirop|glucose/i.test(l.name);
  return{name:l.name,kg:num(l.qty),ebc:g.ebc!==''&&g.ebc!=null?g.ebc:lib?lib[1]:def?def[0]:(sugar?0:''),extract:g.extract!==''&&g.extract!=null?g.extract:lib?lib[2]:def?def[1]:(sugar?100:'')}}
function hxHop(l){const g=hxLook(l.name)||{};const lib=LIB.hops.find(x=>norm(x[0])===norm(l.name));const id=(HX_SCHEMA.houblon.find(x=>norm(x[1])===norm(l.name))||[])[0];
  const aa=num(g.aa)||(lib?lib[1]:id&&HX_DEF[id]?HX_DEF[id][0]:'');const m=String(l.moment||"75'").trim();let use='boil',time=num(m);
  if(/^dh/i.test(m)){use='dry';time=11}else if(/whirl/i.test(m)){use='whirlpool';time=20}else if(time===0){use='flameout';time=10}
  return{name:l.name,g:Math.round(num(l.qty)*1000*10)/10,aa,use,time}}
function hxYeastAtt(name){const n=norm(name).replace(/[^a-z0-9]/g,'');const y=LIB.yeasts.find(x=>{const k=norm(x[0]).replace(/[^a-z0-9]/g,'');return k===n||k.endsWith(n)||n.endsWith(k)});return y?y[1]:75}
function hexagoneRecipes(j,vol){
  const R=j&&j.recipes;if(!R||typeof R!=='object')return null;
  const sys=systems()[0];
  return Object.values(R).filter(r=>r&&r.name).map(r=>{
    const x={...newRecipe(),name:String(r.name).trim(),style:'',systemId:sys?.id||'',volume:vol};
    x.malts=(r.malts||[]).filter(l=>l&&l.name).map(hxMalt);
    x.hops=(r.houblons||[]).filter(l=>l&&l.name).map(hxHop);
    const lev=(r.levures||[]).filter(l=>l&&l.name);
    x.yeast=lev.length?{name:lev[0].name,qty:num(lev[0].qty)||1,unit:'sachet',att:hxYeastAtt(lev[0].name)}:{name:'',qty:1,unit:'sachet',att:''};
    x.others=[...lev.slice(1).map(l=>({name:l.name,qty:num(l.qty),unit:'sachet',when:'ferm'})),
      ...(r.sels||[]).filter(l=>l&&l.name).map(l=>({name:l.name,qty:l.unite==='cl'?num(l.qty)*10:num(l.qty),unit:l.unite==='ml'||l.unite==='cl'?'mL':'g',when:'mash'}))];
    const steps=(r.paliersEmpatage&&r.paliersEmpatage.length?r.paliersEmpatage:(r.tempEmpatage||r.dureeEmpatage?[{nom:'',temp:r.tempEmpatage,duree:r.dureeEmpatage}]:[]))
      .filter(p=>num(p.temp)||num(p.duree)).map((p,i)=>({name:(p.nom||'').trim()||(i?'Palier '+(i+1):'Empâtage'),temp:num(p.temp)||67,min:num(p.duree)||60}));
    if(steps.length)x.mash={...x.mash,steps};
    const boilMax=Math.max(0,...x.hops.filter(h=>h.use==='boil').map(h=>num(h.time)));
    x.boil=Math.max(num(r.ebullition)||60,boilMax);
    x.ferm=[{name:'Fermentation',temp:num(r.tempFermentation)||19,days:14},{name:'Garde froide',temp:4,days:14}];
    x.notes=[r.notes||'',num(r.tempLevure)?'Ensemencement à '+fN(num(r.tempLevure))+' °C.':'',(r.nettoyage||[]).length?'Nettoyage : '+r.nettoyage.map(n=>n.name+' '+fN(num(n.qty))+' '+(n.unite||'L')).join(', ')+'.':''].filter(Boolean).join('\n');
    // rendement ajusté pour retrouver le degré annoncé dans Hexagone
    const abv=num(r.abv);x.efficiency=72;x.hxAbv=abv;
    if(abv>0&&x.malts.length){const lo=calc({...x,efficiency:1}),hi=calc({...x,efficiency:100});
      if(hi.abv>lo.abv){const e=1+(abv-lo.abv)/(hi.abv-lo.abv)*99;x.efficiency=Math.round(Math.max(40,Math.min(98,e)))}}
    return x});
}

const hxArr=o=>Array.isArray(o)?o.filter(Boolean):Object.values(o||{}).filter(Boolean);
const hxDay=v=>{if(!v)return '';if(typeof v==='number')return new Date(v).toISOString().slice(0,10);const t=String(v).slice(0,10);return /^\d{4}-\d\d-\d\d$/.test(t)?t:''};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const HX_PH={fermentation:'Fermentation',garde:'Garde',dh:'Dry hop'};
function hxPhase(f){const p=f&&f.phases||{};return p.dh?.active?'dh':p.garde?.active?'garde':p.fermentation?.active?'fermentation':''}
function hexagoneCellar(j){
  if(!j||(!j.fermenters&&!j.historique))return null;
  const ferms=hxArr(j.fermenters).filter(f=>f.id!=null).map(f=>({hx:String(f.id),name:String(f.label||f.id),capacity:num(f.vol),src:f}));
  const suivi=j.fermSuivi||{};const hist=Object.entries(j.historique||{}).map(([k,e])=>({...e,id:e.id||k}));
  const actifs=hist.filter(e=>['fermentation','garde','dh'].includes(e.statut));
  // cuves occupées sans fiche d'historique : on crée quand même le brassin
  ferms.forEach(f=>{if(!f.src.beer)return;if(actifs.some(e=>String(e.cuve)===f.hx))return;
    actifs.push({id:'cuve_'+f.hx,recette:f.src.beer,brewNum:f.src.brewNum||'',cuve:f.hx,statut:hxPhase(f.src)||'fermentation',ts:f.src.phases?.fermentation?.debut||'',fromFerm:true})});
  const brews=actifs.map(e=>{
    const f=ferms.find(x=>x.hx===String(e.cuve));const fs=f?f.src:{};const ph=fs.phases||{};
    const sv=suivi[e.id]||{};
    const date=hxDay(ph.fermentation?.debut&&String(fs.brewNum||'')===String(e.brewNum||'')?ph.fermentation.debut:'')||hxDay(e.ts)||hxDay(ph.fermentation?.debut)||today();
    const rec=S.recipes.find(r=>norm(r.name)===norm(e.recette||''));
    const recipe=rec?JSON.parse(JSON.stringify(rec)):{...newRecipe(),name:e.recette||'Sans nom'};
    const gardeDeb=hxDay(ph.garde?.active||ph.dh?.active?ph.garde?.debut:'');
    const dFerm=gardeDeb&&gardeDeb>date?daysBetween(date,gardeDeb):(num(fs.dureeFerm)||num(recipe.ferm?.[0]?.days)||14);
    recipe.ferm=[{name:'Fermentation',temp:num(fs.tempFerm)||num(recipe.ferm?.[0]?.temp)||19,days:dFerm},{name:'Garde',temp:num(fs.tempGarde)||4,days:num(fs.dureeGarde)||14}];
    const dhDate=hxDay(sv.dateDH)||hxDay(ph.dh?.debut);
    if(dhDate&&dhDate>=date)(recipe.hops||[]).forEach(h=>{if(h.use==='dry')h.time=daysBetween(date,dhDate)});
    const readings=hxArr(sv.densites).map(d=>({date:hxDay(d.date)||date,sg:num(d.sg)||(num(d.val)>1.2?0:num(d.val)),temp:'',note:''})).filter(r=>r.sg>0.98&&r.sg<1.2).sort((a,b)=>a.date<b.date?-1:1);
    const di=num(sv.di);if(di>1&&!readings.some(r=>Math.abs(r.sg-di)<0.0005&&r.date===date))readings.unshift({date,sg:di,temp:'',note:'DI'});
    const pk={fermentation:'ferm',garde:'garde',dh:'dh'}[e.statut]||'ferm';const manualPhase={k:pk,since:hxDay(ph[e.statut]?.debut)||date};
    return{manualPhase,hx:String(e.id),name:recipe.name,lot:e.brewNum||e.lot||'',hxLot:e.lot||'',date,cuve:e.cuve!=null?String(e.cuve):'',phase:e.statut,volume:num(e.volume)||num(fs.vol)||num(recipe.volume)||0,recipe,recipeId:rec?rec.id:'',readings,og:di>1?di:(readings[0]?.sg||0),dfHx:num(sv.df),noRecipe:!rec,fromFerm:!!e.fromFerm}});
  return{ferms,brews};
}
function importHexagoneCellar(C){
  let fa=0,fu=0,ba=0,bu=0;const map={};
  C.ferms.forEach(f=>{let ex=S.equipment.find(e=>e.type==='fermenter'&&(e.hx===f.hx||norm(e.name)===norm(f.name)));
    if(ex){Object.assign(ex,{name:f.name,capacity:f.capacity||ex.capacity,hx:f.hx});fu++}else{ex={id:uid(),type:'fermenter',name:f.name,capacity:f.capacity,hx:f.hx};S.equipment.push(ex);fa++}map[f.hx]=ex.id});
  C.brews.forEach(x=>{const b={id:uid(),recipeId:x.recipeId,name:x.name,lot:x.lot,date:x.date,fermId:map[x.cuve]||'',volume:x.volume,status:'fermenting',recipe:x.recipe,readings:x.readings,checks:{},deducted:true,og:x.og,hx:x.hx,phase:x.manualPhase,notes:x.hxLot&&x.hxLot!==x.lot?'Lot Hexagone '+x.hxLot:''};
    if(x.recipe.volume!==x.volume&&x.volume)b.recipe.volume=x.volume;
    const i=S.brews.findIndex(o=>o.hx===x.hx);if(i>=0){b.id=S.brews[i].id;S.brews[i]=b;bu++}else{S.brews.push(b);ba++}});
  save();return{fa,fu,ba,bu};
}

// tout ce qui se passe un jour donné : tâches saisies + événements tirés des brassins, commandes et tireuses
function hxDupBrew(t){if(!t.hx||!['brassage','garde','dh'].includes(t.type))return null;
  return S.brews.find(b=>b.status!=='done'&&((t.fermId&&b.fermId===t.fermId)||(t.beer&&norm(t.beer)===norm(b.name)))&&(t.type==='brassage'?Math.abs(diff(b.date,t.date))<=3:t.date>=addDays(b.date,-3)&&t.date<=addDays(brewDates(b).fermEnd||b.date,10)))||null}
function planEvents(from,to){const E=[];const inR=d=>d&&d>=from&&d<=to;
  coll('tasks').forEach(t=>{if(inR(t.date)&&!hxDupBrew(t)){const T=ttOf(t.type);E.push({date:t.date,c:T[2],t:t.title||T[1],sub:[t.title?T[1]:'',t.beer,t.fermId&&byId('equipment',t.fermId)?byId('equipment',t.fermId).name:'',t.client,t.lieu].filter(Boolean).join(' · '),act:'editTask',id:t.id,done:t.done,mv:'task:'+t.id,k:0})}});
  S.brews.filter(b=>b.status!=='done').forEach(b=>{const h='#/brassins/'+b.id,f=byId('equipment',b.fermId);const fn=f?' · '+f.name:'';
    if(inR(b.date)&&b.status!=='packaged')E.push({date:b.date,c:ttOf('brassage')[2],t:'Brassage '+b.name,sub:[b.lot,f&&f.name].filter(Boolean).join(' · '),href:h,mv:b.status==='planned'?'brew:'+b.id:'',k:1});
    if(b.status==='fermenting'||b.status==='planned'){const d=brewDates(b);
      d.steps.forEach((st,i)=>{if(i&&inR(st.start))E.push({date:st.start,c:/garde/i.test(st.name)?ttOf('garde')[2]:'#6b5f50',t:st.name+' '+b.name,sub:fN(num(st.temp))+' °C · '+fN(num(st.days))+' j'+fn,href:h,mv:'step:'+b.id+':'+i,k:2})});
      const dg={};d.dry.forEach(x=>{(dg[x.date]=dg[x.date]||[]).push(x)});
      Object.entries(dg).forEach(([dt,L])=>{if(inR(dt))E.push({date:dt,c:ttOf('dh')[2],t:'Dry hop '+b.name,sub:L.map(x=>fN(num(x.g))+' g '+x.name).join(', ')+fn,href:h,mv:'dry:'+b.id+':'+dt,k:2})});
      if(d.steps.length&&inR(d.fermEnd))E.push({date:d.fermEnd,c:'#b3261e',t:'À conditionner : '+b.name,sub:'cuve libérée'+fn,href:h,mv:'end:'+b.id,k:2})}
    if(b.status==='packaged'&&inR(b.readyDate))E.push({date:b.readyDate,c:'#2f8a4a',t:b.name+' prête',sub:b.packType||'',href:h,k:3})});
  coll('orders').filter(o=>o.status!=='cancel').forEach(o=>{const c=clientOf(o),n=c?c.nom:o.client||'';
    if(o.status==='todo'&&inR(o.date))E.push({date:o.date,c:ttOf('livraison')[2],t:'Livraison '+n,sub:linesTxt(o.lines)+tapsTxt(o),act:'editOrder',id:o.id,mv:'order:'+o.id,k:1});
    if((o.taps||[]).length&&!o.tapBack&&inR(o.dateReprise))E.push({date:o.dateReprise,c:'#6b5f50',t:'Reprise tireuse '+n,sub:o.taps.map(id=>(byId('equipment',id)||{}).name||'').join(', '),href:'#/commandes',mv:'tap:'+o.id,k:2})});
  return E.sort((a,b)=>a.k-b.k)}
const evHtml=e=>`<${e.href?'a':'div'} class="ev ${e.done?'done':''} ${e.mv?'mv':''}" style="--c:${e.c}" ${e.mv?`data-mv="${e.mv}" draggable="false"`:''} ${e.href?`href="${e.href}"`:`data-act="${e.act}" data-id="${e.id}"`}>${esc(e.t)}${e.sub?`<small>${esc(e.sub)}</small>`:''}</${e.href?'a':'div'}>`;
V.planning=()=>{const t=today();const start=ui.wk||monday(t);const days=[...Array(14)].map((_,i)=>addDays(start,i));const end=days[13];
  const E=planEvents(start,end);const n=E.length;
  return `<div class="head"><div><div class="kicker">Du ${fD(start)} au ${fD(end)} · ${n} événement(s)</div><h1>Planning</h1></div>
   <div class="actions"><button class="btn" data-act="wk" data-v="-1" aria-label="Semaine précédente">‹</button><button class="btn" data-act="wk" data-v="0">Cette semaine</button><button class="btn" data-act="wk" data-v="1" aria-label="Semaine suivante">›</button><button class="btn pri" data-act="newTask">Ajouter</button></div></div>
  ${[0,7].map(o=>`<div class="wk-t">Semaine du ${fD(days[o])}${days[o]===monday(t)?' · cette semaine':''}</div><div class="wk">${days.slice(o,o+7).map(d=>{const L=E.filter(e=>e.date===d);return `<div class="wk-d ${d===t?'today':d<t?'past':''} ${L.length?'':'empty-day'}" data-day="${d}"><div class="wk-h"><span>${new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short'})}</span><b>${+d.slice(8)}</b></div>${L.map(evHtml).join('')}<button class="wk-add" data-act="newTask" data-d="${d}">+</button></div>`}).join('')}</div>`).join('')}
  <div class="legend" style="margin-top:14px">${TTYPES.slice(0,-1).map(([,l,c])=>`<span><i style="--c:${c}"></i>${l}</span>`).join('')}<span><i style="--c:#b3261e"></i>À conditionner</span></div>
  <p class="small muted" style="margin-top:8px">Les brassins, dry hops, mises en garde, livraisons et reprises de tireuses s'affichent tout seuls. Ajoute le reste : nettoyages, marchés, festivals, congés… Pour déplacer une tâche, une livraison, un brassin prévu, une mise en garde, un dry hop ou une fin de cuve, fais-le glisser sur un autre jour : les durées du brassin suivent (sur téléphone : appui long puis glisser).</p>`};
V.planning.after=()=>planDnd();
function moveEv(mv,date){const [k,id]=mv.split(':');let msg='';
  if(k==='task'){const t=coll('tasks').find(x=>x.id===id);if(!t||t.date===date)return;t.date=date;msg=(t.title||ttOf(t.type)[1])}
  else if(k==='order'){const o=byId('orders',id);if(!o||o.date===date)return;o.date=date;msg='Livraison'}
  else if(k==='tap'){const o=byId('orders',id);if(!o||o.dateReprise===date)return;o.dateReprise=date;msg='Reprise tireuse'}
  else if(k==='brew'){const b=byId('brews',id);if(!b||b.date===date)return;b.date=date;msg='Brassage '+b.name}
  else{const b=byId('brews',id);if(!b||!b.recipe)return;const F=b.recipe.ferm||[],d=brewDates(b),x=mv.split(':')[2];let D=0;
    if(k==='step'){const i=+x,st=d.steps[i];if(!st||!F[i-1])return;D=diff(st.start,date);if(!D)return;
      const prev=num(F[i-1].days)+D;if(prev<1)return toast('Impossible : '+F[i-1].name+' durerait moins d\'un jour');
      F[i-1].days=prev;msg=st.name+' de '+b.name+' décalée de '+(D>0?'+':'')+D+' j ('+F[i-1].name+' : '+prev+' j)'}
    else if(k==='end'){const L=F[F.length-1];if(!L)return;D=diff(d.fermEnd,date);if(!D)return;const nd=num(L.days)+D;
      if(nd<1)return toast('Impossible : '+L.name+' durerait moins d\'un jour');L.days=nd;msg=L.name+' de '+b.name+' : '+nd+' j ('+(D>0?'+':'')+D+' j)'}
    else if(k==='dry'){D=diff(x,date);if(!D)return;const t=diff(b.date,date);if(t<0)return toast('Le dry hop ne peut pas être avant le brassage');
      (b.recipe.hops||[]).forEach(h=>{if(h.use==='dry'&&addDays(b.date,num(h.time))===x)h.time=t});msg='Dry hop de '+b.name+' décalé de '+(D>0?'+':'')+D+' j'}
    save();render();return toast(msg)}
  save();render();toast(msg+' déplacé au '+fD(date))}
let DND=null,DND_CLICK=0;
function planDnd(){const root=$('#app');
  const dayAt=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest('.wk-d[data-day]')};
  const hl=(x,y)=>{const day=dayAt(x,y);$$('.wk-d.drop').forEach(z=>z!==day&&z.classList.remove('drop'));if(day)day.classList.add('drop')};
  const start=(ev,e)=>{const r=ev.getBoundingClientRect();const g=ev.cloneNode(true);g.classList.add('ev-ghost');g.style.width=r.width+'px';g.style.left=r.left+'px';g.style.top=r.top+'px';document.body.appendChild(g);
    ev.classList.add('drag-src');DND.g=g;DND.dx=e.clientX-r.left;DND.dy=e.clientY-r.top;DND.on=true;DND.lx=e.clientX;DND.ly=e.clientY;
    const D=DND,loop=()=>{if(DND!==D||!D.on)return;const m=80,y=D.ly;const v=y<m?-Math.ceil((m-y)/6):y>innerHeight-m?Math.ceil((y-innerHeight+m)/6):0;if(v){scrollBy(0,v);hl(D.lx,D.ly)}requestAnimationFrame(loop)};requestAnimationFrame(loop);if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}};
  const move=e=>{if(!DND)return;if(DND.on&&DND.touch&&e.pointerType)return;const d=Math.hypot(e.clientX-DND.x,e.clientY-DND.y);
    if(!DND.on){if(DND.touch){if(d>10){clearTimeout(DND.tm);DND=null}return}if(d<6)return;start(DND.ev,e)}
    e.preventDefault();DND.g.style.left=(e.clientX-DND.dx)+'px';DND.g.style.top=(e.clientY-DND.dy)+'px';
    DND.lx=e.clientX;DND.ly=e.clientY;hl(e.clientX,e.clientY)};
  const end=e=>{if(!DND)return;if(DND.on&&DND.touch&&e.pointerType)return;clearTimeout(DND.tm);const D=DND;DND=null;if(!D.on)return;
    D.g.parentNode&&D.g.parentNode.removeChild(D.g);D.ev.classList.remove('drag-src');$$('.wk-d.drop').forEach(x=>x.classList.remove('drop'));DND_CLICK=Date.now();
    const day=dayAt(e.clientX,e.clientY);if(day)moveEv(D.mv,day.dataset.day)};
  root.onpointerdown=e=>{const ev=e.target.closest('.ev.mv');if(!ev||e.button>0)return;
    DND={ev,mv:ev.dataset.mv,x:e.clientX,y:e.clientY,touch:e.pointerType!=='mouse',on:false};
    if(DND.touch){const D=DND;D.tm=setTimeout(()=>{if(DND===D){start(ev,e);try{ev.releasePointerCapture(e.pointerId)}catch(_){}}},350)}};
  if(!window._dndWired){window._dndWired=1;
    addEventListener('pointermove',move,{passive:false});addEventListener('pointerup',end);addEventListener('pointercancel',e=>{if(DND&&!DND.on){clearTimeout(DND.tm);DND=null}});
    const tp=(e,t)=>({clientX:t.clientX,clientY:t.clientY,preventDefault:()=>e.preventDefault()});
    addEventListener('touchmove',e=>{if(DND&&DND.on){e.preventDefault();move(tp(e,e.touches[0]))}},{passive:false});
    addEventListener('touchend',e=>{if(DND&&DND.on)end(tp(e,e.changedTouches[0]))});
    addEventListener('contextmenu',e=>{if(DND||e.target.closest&&e.target.closest('.ev.mv'))e.preventDefault()});
    document.addEventListener('click',e=>{if(Date.now()-DND_CLICK<120){e.preventDefault();e.stopPropagation()}},true);
    document.addEventListener('dragstart',e=>{if(e.target.closest&&e.target.closest('.ev.mv'))e.preventDefault()})}}

   <div class="fr"><label class="f">Type<select name="type">${optH(TTYPES.map(t=>[t[0],t[1]]),tk.type)}</select></label><label class="f">Date<input type="date" name="date" value="${esc(tk.date)}"></label></div>

   <div class="fr"><label class="f">Client<select name="client"><option value="">—</option>${optH(coll('clients').map(c=>c.nom).sort(),tk.client)}</select></label><label class="f">Lieu<input name="lieu" value="${esc(tk.lieu)}"></label></div>
   <label class="f">Note<input name="note" value="${esc(tk.note)}"></label>
   ${isNew?'':`<label class="row" style="cursor:pointer;font-weight:400"><input type="checkbox" name="done" ${tk.done?'checked':''} style="width:auto"> <span>Fait</span></label>`}`,
   extra:isNew?'':'<button type="button" class="btn danger" id="del">Supprimer</button>',
   onOpen:f=>{const sw=()=>{$('#tkBrew',f).style.display=f.elements.type.value==='brassage'&&isNew?'':'none'};f.elements.type.onchange=sw;sw();
     $('#tkGoBrew',f).onclick=()=>{ui.brewDate=f.elements.date.value;dlg.close();brewForm()};
     const d=$('#del',f);if(d)d.onclick=()=>{S.tasks=coll('tasks').filter(x=>x.id!==tk.id);save();dlg.close();render()}},
   onSubmit:f=>{const o={type:fv(f,'type'),date:fv(f,'date')||today(),title:fv(f,'title'),beer:fv(f,'beer'),fermId:fv(f,'fermId'),client:fv(f,'client'),lieu:fv(f,'lieu'),note:fv(f,'note'),done:f.elements.done?f.elements.done.checked:false};
     if(isNew)coll('tasks').push({id:uid(),...o});else Object.assign(tk,o);ui.wk=monday(o.date);toast('Planning mis à jour')}})}
/* import du planning d'Hexagone */
const HX_TT={brassin:'brassage',garde:'garde',dh:'dh',enfutage:'enfutage',embout:'embouteillage',nett_enzy:'nettoyage',nett_neutro:'nettoyage',cip:'nettoyage',livraison:'livraison',marche:'marche',festival:'festival',tto:'tto',cp:'conges'};
const HX_TT_LBL={nett_enzy:'Nettoyage enzymatique',nett_neutro:'Nettoyage Neutro',cip:'CIP'};
function hexagonePlanning(j){if(!j||!j.planning)return null;const from=addDays(today(),-30);const ferm=hxArr(j.fermenters);const out=[];
  Object.entries(j.planning).forEach(([k,list])=>{const date=hxDay(k);if(!date||date<from)return;hxArr(list).forEach(t=>{if(!t||!t.type)return;
    const f=ferm.find(x=>String(x.id)===String(t.fermId));
    out.push({hx:String(t.id||k+t.type),type:HX_TT[t.type]||'autre',date,title:([HX_TT_LBL[t.type]||'',t.eventName||''].filter(Boolean).join(' · ')||(t.brewNum?ttOf(HX_TT[t.type]||'autre')[1]:''))+(t.brewNum?' '+t.brewNum:''),beer:t.beer||'',hxFerm:f?String(f.id):'',client:t.client||'',lieu:t.lieu||'',note:t.note||'',done:false})})});
  return out.sort((a,b)=>a.date<b.date?-1:1)}
function hexagonePlanningDialog(j){const L=hexagonePlanning(j);if(!L)return toast('Ce n\'est pas une sauvegarde Hexagone');if(!L.length)return toast('Aucune tâche récente dans le planning');
  const by={};L.forEach(t=>by[t.type]=(by[t.type]||0)+1);
  openDlg({title:'Planning d\'Hexagone',submit:'Importer '+L.length+' tâche(s)',body:`<p class="small muted">Tâches des 30 derniers jours et à venir. Une tâche déjà importée est mise à jour, pas dupliquée.</p>
   <div class="rows">${Object.entries(by).map(([k,n])=>`<div class="row"><div class="main"><b>${esc(ttOf(k)[1])}</b></div><div class="qty">${n}</div></div>`).join('')}</div>
   <p class="small muted">Les brassins déjà importés apparaissent aussi au planning : si un brassage Hexagone fait doublon, supprime simplement la tâche.</p>`,
   onSubmit:()=>{let a=0,u=0;L.forEach(o=>{const fe=o.hxFerm?S.equipment.find(e=>e.type==='fermenter'&&e.hx===o.hxFerm):null;const d={...o,fermId:fe?fe.id:''};delete d.hxFerm;if(hxDupBrew(d)){S.tasks=coll('tasks').filter(x=>x.hx!==d.hx);return}
     const ex=coll('tasks').find(x=>x.hx===o.hx);if(ex){Object.assign(ex,d);u++}else{coll('tasks').push({id:uid(),...d});a++}});save();ui.wk='';go('/planning');toast(a+' tâche(s) ajoutée(s)'+(u?', '+u+' mise(s) à jour':''))}})}
/* ================= ventes : clients, commandes, BL ================= */
const coll=k=>{if(!Array.isArray(S[k]))S[k]=[];return S[k]};
const CTYPES=['Bar / restaurant','Cave / épicerie','Particulier','Comité / association','Distributeur','Autre'];
const clientName=c=>c?c.nom:'';
function clientOf(o){return coll('clients').find(c=>c.id===o.clientId)||coll('clients').find(c=>norm(c.nom)===norm(o.client||''))}
const beerNames=()=>[...new Set([...S.recipes.map(r=>r.name),...stk().map(x=>x.beer)])].filter(Boolean).sort((a,b)=>a.localeCompare(b));
const lineQty=l=>num(l.qty)*(!isKeg(l.format)&&num(l.carton)?num(l.carton):1);
function lotsTxt(L){const x=[...new Set((L||[]).map(l=>l.lot).filter(Boolean))];return x.length?' · lot '+x.join(', '):''}
function linesTxt(L){const t={btl:0,keg:0};(L||[]).forEach(l=>{if(isKeg(l.format))t.keg+=lineQty(l);else t.btl+=lineQty(l)});return totTxt(t)}
function stockFor(beer,format){return stk().filter(l=>norm(l.beer)===norm(beer)&&l.format===format).reduce((a,l)=>a+num(l.qty),0)}
function orderShort(o){const need={};(o.lines||[]).forEach(l=>{const k=norm(l.beer)+'|'+l.format;need[k]=(need[k]||0)+lineQty(l)});
  return Object.entries(need).filter(([k,q])=>{const [b,f]=k.split('|');return stockFor((o.lines.find(l=>norm(l.beer)===b)||{}).beer||b,f)<q}).length}
function nextNum(prefix,list,field){const t=today(),ym=t.slice(2,4)+t.slice(5,7);const n=list.filter(x=>String(x[field]||'').startsWith(prefix+ym)).length+1;return prefix+ym+'-'+String(n).padStart(3,'0')}
function lineLabel(l){return l.label||`${l.beer} — ${fmtOf(l.format)[1]}`}
function qtyLabel(l){const q=lineQty(l);return isKeg(l.format)?fN(q)+' '+unitOf(l.format,q):(num(l.carton)?fN(num(l.qty))+' carton'+(num(l.qty)>1?'s':'')+' de '+fN(num(l.carton))+' ('+fN(q)+' btl)':fN(q)+' '+unitOf(l.format,q))}

/* --- lots --- */
function reservedLot(beer,format,lot,exceptId){return coll('orders').filter(o=>o.status==='todo'&&o.id!==exceptId).reduce((a,o)=>a+(o.lines||[]).filter(l=>norm(l.beer)===norm(beer)&&l.format===format&&(l.lot||'')===(lot||'')&&l.lot).reduce((x,l)=>x+lineQty(l),0),0)}
function lotsFor(beer,format,exceptId){const m={};stk().filter(l=>norm(l.beer)===norm(beer)&&l.format===format&&num(l.qty)>0).sort((a,b)=>(a.date||'')<(b.date||'')?-1:1)
  .forEach(l=>{const k=l.lot||'';m[k]=m[k]||{lot:k,qty:0,date:l.date||''};m[k].qty+=num(l.qty)});return Object.values(m).map(x=>({...x,free:x.qty-reservedLot(beer,format,x.lot,exceptId)}))}
function lotOptions(l,exceptId){const L=lotsFor(l.beer||'',l.format||'',exceptId);const cur=l.lot||'';
  return `<option value="">${L.length?'Lot le plus ancien (auto)':'Aucun lot en stock'}</option>${L.map(x=>`<option value="${esc(x.lot)}" ${x.lot===cur?'selected':''}>${esc(x.lot||'sans n° de lot')} · ${fN(x.free)} dispo</option>`).join('')}${cur&&!L.some(x=>x.lot===cur)?`<option value="${esc(cur)}" selected>${esc(cur)}</option>`:''}`}
/* --- éditeur de lignes (commande / BL) --- */
let LN_EXCEPT='';
function linesEditor(L,withLot,exceptId){LN_EXCEPT=exceptId||'';const bn=beerNames();
  return `<datalist id="dl-beer2">${bn.map(n=>`<option value="${esc(n)}">`).join('')}</datalist><div class="lines-ed" id="lnBox">${(L.length?L:[{beer:'',format:'fut30inox',qty:''}]).map((l,i)=>lineRow(l,i,withLot)).join('')}</div>
   <button type="button" class="btn sm" id="lnAdd">+ Ajouter une ligne</button>`}
function beerOptions(cur){const bn=beerNames();return `<option value="">— Bière —</option>${bn.map(n=>`<option ${n===cur?'selected':''}>${esc(n)}</option>`).join('')}${cur&&!bn.includes(cur)?`<option selected>${esc(cur)}</option>`:''}`}
function lineRow(l,i,withLot){return `<div class="ln" data-i="${i}" data-k="${esc(norm(l.beer||'')+'|'+(l.format||'fut30inox'))}"><select data-f="beer">${beerOptions(l.beer||'')}</select><select data-f="format">${optH(FORMATS.map(f=>[f[0],f[1]]),l.format||'fut30inox')}</select><input data-f="qty" inputmode="decimal" placeholder="Qté" value="${esc(l.qty??'')}">${withLot?'<span></span>':`<select data-f="carton"><option value="0">à l'unité</option>${[6,12,24].map(c=>`<option value="${c}" ${num(l.carton)===c?'selected':''}>cartons de ${c}</option>`).join('')}</select>`}<select data-f="lot" title="Lot">${lotOptions(l,LN_EXCEPT)}</select><button type="button" class="iconbtn" data-rm="${i}" aria-label="Retirer">✕</button></div>`}
function readLines(f){return [...f.querySelectorAll('.ln')].map(r=>{const o={};r.querySelectorAll('[data-f]').forEach(e=>o[e.dataset.f]=e.value.trim());o.qty=num(o.qty);if('carton' in o)o.carton=num(o.carton);if(isKeg(o.format))o.carton=0;return o})}
function wireLines(f,withLot){const box=$('#lnBox',f);const redraw=L=>{box.innerHTML=L.map((l,i)=>lineRow(l,i,withLot)).join('')};
  $('#lnAdd',f).onclick=()=>{const L=readLines(f);L.push({beer:L.length?L[L.length-1].beer:'',format:L.length?L[L.length-1].format:'fut30inox',qty:''});redraw(L)};
  box.onchange=e=>{const f0=e.target.dataset.f;if(f0!=='beer'&&f0!=='format')return;const row=e.target.closest('.ln');const o={};row.querySelectorAll('[data-f]').forEach(x=>o[x.dataset.f]=x.value.trim());const k=norm(o.beer)+'|'+o.format;if(row.dataset.k===k)return;row.dataset.k=k;o.lot='';row.querySelector('[data-f=lot]').innerHTML=lotOptions(o,LN_EXCEPT)};
  box.onclick=e=>{const b=e.target.closest('[data-rm]');if(!b)return;const L=readLines(f);L.splice(+b.dataset.rm,1);redraw(L.length?L:[{beer:'',format:'fut30inox',qty:''}])}}
const cleanLines=L=>L.filter(l=>l.beer&&l.qty>0);


/* --- tireuses prêtées avec les commandes --- */
const taps=()=>S.equipment.filter(e=>e.type==='tireuse').sort((a,b)=>a.name.localeCompare(b.name,'fr',{numeric:true}));
// une tireuse est « dehors » si une commande livrée la contient et qu'elle n'est pas revenue
function tapOut(e){return coll('orders').find(o=>o.status==='done'&&(o.taps||[]).includes(e.id)&&!o.tapBack)}
function tapPlanned(e,exceptId){return coll('orders').filter(o=>o.status==='todo'&&o.id!==exceptId&&(o.taps||[]).includes(e.id)).sort((a,b)=>a.date<b.date?-1:1)}
function tapStatus(e){const o=tapOut(e);const c=o&&clientOf(o);const p=tapPlanned(e)[0];
  return [esc(e.brand||''),o?`chez ${esc(c?c.nom:o.client||'')} depuis le ${fD(o.date)}${o.dateReprise?', reprise le '+fD(o.dateReprise):''}`:'',p?`prévue pour ${esc((clientOf(p)||{}).nom||p.client||'')} le ${fD(p.date)}`:''].filter(Boolean).join(' · ')||'&nbsp;'}
function tapBadge(e){const o=tapOut(e);return o?(o.dateReprise&&o.dateReprise<today()?'<span class="badge warn">À récupérer</span>':'<span class="badge acc">Prêtée</span>'):'<span class="badge ok">Disponible</span>'}
function tapsEditor(o){const T=taps();if(!T.length)return `<div class="note small">Pas encore de tireuse : ajoute-les dans <a href="#/equipement">Équipement</a> (type « Tireuse à bière »).</div>`;
  return `<div class="f" style="gap:6px"><span>Tireuses prêtées</span><div class="rows">${T.map(e=>{const out=tapOut(e),pl=tapPlanned(e,o.id);const busy=(out&&out.id!==o.id)||pl.length;
    return `<label class="row" style="cursor:pointer;font-weight:400"><input type="checkbox" name="tap" value="${e.id}" ${(o.taps||[]).includes(e.id)?'checked':''} style="width:auto"><div class="main"><b>${esc(e.name)}</b><span class="small ${busy?'':'muted'}" ${busy?'style="color:var(--warn)"':''}>${out&&out.id!==o.id?'chez '+esc((clientOf(out)||{}).nom||out.client||'')+(out.dateReprise?' jusqu\'au '+fD(out.dateReprise):''):pl.length?'déjà prévue pour '+esc((clientOf(pl[0])||{}).nom||pl[0].client||'')+' le '+fD(pl[0].date):esc(e.brand||'Disponible')}</span></div></label>`}).join('')}</div></div>
   <label class="f">Date de reprise des tireuses<input type="date" name="dateReprise" value="${esc(o.dateReprise||'')}"></label>`}
const readTaps=f=>[...f.querySelectorAll('input[name=tap]:checked')].map(x=>x.value);
const tapsTxt=o=>(o.taps||[]).length?' · '+(o.taps.length>1?o.taps.length+' tireuses':'1 tireuse'):'';
/* --- clients --- */
V.clients=()=>{const q=norm(ui.cq||'');const L=coll('clients').filter(c=>!q||norm([c.nom,c.ville,c.contact].join(' ')).includes(q)).sort((a,b)=>a.nom.localeCompare(b.nom));
  return `<div class="head"><div><div class="kicker">${coll('clients').length} client(s)</div><h1>Clients</h1></div><div class="actions"><button class="btn pri" data-act="newClient">Nouveau client</button></div></div>
  <input id="cq" placeholder="Rechercher un client, une ville…" value="${esc(ui.cq||'')}" style="margin-bottom:12px">
  ${L.length?`<div class="rows">${L.map(c=>{const nb=coll('bls').filter(b=>clientOf(b)===c).length,no=coll('orders').filter(o=>clientOf(o)===c&&o.status==='todo').length;
    return `<div class="row click" data-act="editClient" data-id="${c.id}"><div class="main"><b>${esc(c.nom)}</b><span class="small muted">${[c.type,[c.cp,c.ville].filter(Boolean).join(' '),c.contact,c.tel].filter(Boolean).map(esc).join(' · ')||'&nbsp;'}</span></div>${no?`<span class="badge acc">${no} à livrer</span>`:''}<span class="small muted">${nb} BL</span></div>`}).join('')}</div>`
   :emptyBox(coll('clients').length?'Aucun résultat':'Aucun client','Ajoute tes clients : bars, caves, particuliers… Tu les retrouveras dans les commandes et les BL.','<button class="btn pri" data-act="newClient">Nouveau client</button>')}`};
V.clients.after=()=>{const q=$('#cq');if(q)q.oninput=()=>{ui.cq=q.value;const p=q.selectionStart;render();const n=$('#cq');n.focus();n.setSelectionRange(p,p)}};
function clientForm(c,then){const isNew=!c;c=c||{nom:'',type:'Bar / restaurant'};
  const hist=isNew?[]:[...coll('bls').filter(b=>clientOf(b)===c)].sort((a,b)=>a.date<b.date?1:-1).slice(0,8);
  openDlg({title:isNew?'Nouveau client':esc(c.nom),body:`
   <label class="f">Nom<input name="nom" value="${esc(c.nom)}" required></label>
   <div class="fr"><label class="f">Type<select name="type">${optH(CTYPES,c.type)}</select></label><label class="f">Contact<input name="contact" value="${esc(c.contact||'')}"></label></div>
   <div class="fr"><label class="f">Téléphone<input name="tel" inputmode="tel" value="${esc(c.tel||'')}"></label><label class="f">E-mail<input name="email" inputmode="email" value="${esc(c.email||'')}"></label></div>
   <label class="f">Adresse<input name="adresse" value="${esc(c.adresse||'')}"></label>
   <div class="fr"><label class="f">Code postal<input name="cp" inputmode="numeric" value="${esc(c.cp||'')}"></label><label class="f">Ville<input name="ville" value="${esc(c.ville||'')}"></label><label class="f">SIRET<input name="siret" value="${esc(c.siret||'')}"></label></div>
   <label class="f">Notes<textarea name="notes" rows="2">${esc(c.notes||'')}</textarea></label>
   ${hist.length?`<h3 style="font-size:14px">Dernières livraisons</h3><div class="rows">${hist.map(b=>`<div class="row"><div class="main"><b>${esc(b.ref)}</b><span class="small muted">${fD(b.date)} · ${linesTxt(b.lines)}</span></div></div>`).join('')}</div>`:''}`,
   extra:isNew?'':'<button type="button" class="btn danger" id="del">Supprimer</button>',
   onOpen:f=>{const d=$('#del',f);if(d)d.onclick=()=>{if(confirm('Supprimer ce client ? Ses commandes et BL sont conservés.')){S.clients=coll('clients').filter(x=>x.id!==c.id);save();dlg.close();render()}}},
   onSubmit:f=>{const o={};['nom','type','contact','tel','email','adresse','cp','ville','siret','notes'].forEach(k=>o[k]=fv(f,k));if(!o.nom){toast('Nom manquant');return false}
     if(isNew){c={id:uid(),...o};coll('clients').push(c)}else Object.assign(c,o);toast('Client enregistré');if(then)setTimeout(()=>then(c),0)}})}

/* --- commandes --- */
V.commandes=()=>{const t=today();const todo=coll('orders').filter(o=>o.status==='todo').sort((a,b)=>a.date<b.date?-1:1);
  const past=coll('orders').filter(o=>o.status!=='todo').sort((a,b)=>a.date<b.date?1:-1).slice(0,30);
  const row=o=>{const c=clientOf(o);const sh=o.status==='todo'?orderShort(o):0;
    return `<div class="row click" data-act="editOrder" data-id="${o.id}"><div class="main"><b>${esc(c?c.nom:o.client||'—')}</b><span class="small muted">${o.num?esc(o.num)+' · ':''}${fD(o.date)} · ${linesTxt(o.lines)}${lotsTxt(o.lines)}${tapsTxt(o)}${o.dateReprise&&(o.taps||[]).length?' · reprise '+fD(o.dateReprise):''}${o.note?' · '+esc(o.note):''}</span></div>
     ${o.status==='todo'?`${o.date<t?'<span class="badge warn">En retard</span>':o.date===t?'<span class="badge acc">Aujourd\'hui</span>':''}${sh?'<span class="badge warn">Stock insuffisant</span>':''}<button class="btn sm pri" data-act="deliver" data-id="${o.id}">Livrer</button>`
     :o.status==='done'?`${(o.taps||[]).length&&!o.tapBack?`<button class="btn sm" data-act="tapBack" data-id="${o.id}">Tireuses rendues</button>`:''}<span class="badge ok">Livrée</span>${o.blId&&byId('bls',o.blId)?`<a class="btn sm" href="#/bl/${o.blId}">${esc(byId('bls',o.blId).ref)}</a>`:''}`:'<span class="badge">Annulée</span>'}</div>`};
  const need={};todo.forEach(o=>o.lines.forEach(l=>{const k=l.beer+'|'+l.format;need[k]=(need[k]||0)+lineQty(l)}));
  return `<div class="head"><div><div class="kicker">${todo.length} à livrer</div><h1>Commandes</h1></div><div class="actions"><a class="btn" href="#/clients">Clients</a><button class="btn pri" data-act="newOrder">Nouvelle commande</button></div></div>
  <div class="two"><div><h2 style="margin-bottom:10px">À livrer</h2>${todo.length?`<div class="rows">${todo.map(row).join('')}</div>`:emptyBox('Rien à livrer','Note les commandes de tes clients : tu verras ce qu\'il faut préparer, et le BL se fera en un clic.','<button class="btn pri" data-act="newOrder">Nouvelle commande</button>')}</div>
   <div><h2 style="margin-bottom:10px">À préparer</h2>${Object.keys(need).length?`<div class="rows">${Object.entries(need).sort().map(([k,q])=>{const [b,f]=k.split('|');const st=stockFor(b,f);return `<div class="row"><div class="main"><b>${esc(b)}</b><span class="small muted">${esc(fmtOf(f)[1])} · en stock ${fN(st)}</span></div><div class="qty" style="${st<q?'color:var(--warn)':''}">${fN(q)}</div></div>`}).join('')}</div>`:'<div class="note">Le total des commandes à livrer, comparé à ton stock, s\'affiche ici.</div>'}</div></div>
  ${past.length?`<div class="sec"><h2 style="margin-bottom:10px">Livrées</h2><div class="rows">${past.map(row).join('')}</div></div>`:''}`};
function clientSelect(id){return `<div style="display:flex;gap:6px;align-items:flex-end"><label class="f" style="flex:1">Client<select name="clientId"><option value="">— choisir —</option>${optH(coll('clients').slice().sort((a,b)=>a.nom.localeCompare(b.nom)).map(c=>[c.id,c.nom]),id)}</select></label><button type="button" class="btn" id="newCli">+ Client</button></div>`}
function wireClient(f,reopen){const b=$('#newCli',f);if(b)b.onclick=()=>{const keep=reopen(f);dlg.close();clientForm(null,c=>keep(c))}}
function orderForm(o,pre){const isNew=!o;o=o||pre||{clientId:'',date:today(),lines:[],note:'',status:'todo'};
  openDlg({title:isNew?'Nouvelle commande':'Commande'+(o.num?' '+esc(o.num):''),submit:'Enregistrer',body:`${clientSelect(o.clientId||(clientOf(o)||{}).id)}
   <label class="f">Date de livraison<input type="date" name="date" value="${esc(o.date)}"></label>
   ${linesEditor(o.lines||[],false,o.id)}
   ${tapsEditor(o)}
   <label class="f">Note<input name="note" value="${esc(o.note||'')}" placeholder="ex. livrer avant 11 h, reprise des fûts vides"></label>`,
   extra:isNew?'':`<button type="button" class="btn danger" id="del">Supprimer</button>${o.status==='todo'?'<button type="button" class="btn" id="cancel">Annuler la commande</button>':''}`,
   onOpen:f=>{wireLines(f,false);wireClient(f,f=>{const d={...o,clientId:f.elements.clientId.value,date:f.elements.date.value,note:f.elements.note.value,lines:readLines(f),taps:readTaps(f),dateReprise:f.elements.dateReprise?f.elements.dateReprise.value:o.dateReprise};return c=>orderForm(isNew?null:Object.assign(o,{...d,clientId:c.id}),isNew?{...d,clientId:c.id}:null)});
     const d=$('#del',f);if(d)d.onclick=()=>{if(confirm('Supprimer cette commande ?')){S.orders=coll('orders').filter(x=>x.id!==o.id);save();dlg.close();render()}};
     const c=$('#cancel',f);if(c)c.onclick=()=>{o.status='cancel';save();dlg.close();render()}},
   onSubmit:f=>{const L=cleanLines(readLines(f));const cid=f.elements.clientId.value;if(!cid){toast('Choisis un client');return false}const tp=readTaps(f);if(!L.length&&!tp.length){toast('Ajoute au moins une ligne ou une tireuse');return false}
     const d={clientId:cid,client:clientName(byId('clients',cid)),date:f.elements.date.value||today(),note:f.elements.note.value.trim(),lines:L,taps:tp,dateReprise:f.elements.dateReprise?f.elements.dateReprise.value:''};
     const over=L.filter(l=>l.lot&&lineQty(l)>(lotsFor(l.beer,l.format,o.id).find(x=>x.lot===l.lot)||{free:0}).free).map(l=>l.beer+' lot '+l.lot);
     if(isNew)coll('orders').push({id:uid(),num:nextNum('CDE-',coll('orders'),'num'),status:'todo',...d});else Object.assign(o,d);toast(over.length?'Commande enregistrée · lot insuffisant : '+over.join(', '):'Commande enregistrée')}})}
/* sortie de stock : lots les plus anciens d'abord */
function takeStock(beer,format,qty,why,lot){let rest=qty;const used=[];
  stk().filter(l=>norm(l.beer)===norm(beer)&&l.format===format&&num(l.qty)>0).sort((a,b)=>{const pa=lot&&(a.lot||'')===lot?0:1,pb=lot&&(b.lot||'')===lot?0:1;return pa-pb||((a.date||'')<(b.date||'')?-1:1)}).forEach(l=>{if(rest<=0)return;const n=Math.min(rest,num(l.qty));l.qty=num(l.qty)-n;rest-=n;stockMove(l,-n,why);used.push(l.lot||'')});
  return{lots:[...new Set(used.filter(Boolean))].join(', '),missing:rest}}
function makeBl(d){const b={id:uid(),ref:nextNum('BL-',coll('bls'),'ref'),status:'attente',...d};const miss=[];
  b.lines=b.lines.map(l=>{const q=lineQty(l);const r=takeStock(l.beer,l.format,q,'BL '+b.ref,l.lot);if(r.missing>0)miss.push(l.beer+' '+fmtOf(l.format)[1]);return{...l,lot:r.lots||l.lot}});
  b.stockDone=true;coll('bls').push(b);return{b,miss}}
function deliverForm(o){const c=clientOf(o);const sh=orderShort(o);
  openDlg({title:'Livrer · '+esc(c?c.nom:o.client||''),submit:'Créer le BL et sortir du stock',body:`
   <p class="small muted">Vérifie les quantités réellement livrées et les lots. Les bouteilles et fûts sortent du stock (lots les plus anciens d'abord si tu laisses le lot vide).</p>
   <label class="f">Date de livraison<input type="date" name="date" value="${today()}"></label>
   ${linesEditor((o.lines||[]).map(l=>({beer:l.beer,format:l.format,qty:lineQty(l),lot:l.lot||''})),true,o.id)}
   ${(o.taps||[]).length?`<div class="note">Tireuses prêtées : <b>${o.taps.map(id=>esc((byId('equipment',id)||{}).name||'?')).join(', ')}</b>${o.dateReprise?' · reprise le '+fD(o.dateReprise):''}. Elles figureront sur le BL.</div>`:''}
   ${sh?'<div class="note" style="color:var(--warn)">Le stock ne couvre pas toute la commande : le BL sera quand même créé, le stock passera à 0.</div>':''}
   <label class="f">Adresse de livraison<input name="adresse" value="${esc(c?[c.adresse,[c.cp,c.ville].filter(Boolean).join(' ')].filter(Boolean).join(', '):'')}"></label>
   <label class="f">Notes sur le BL<input name="notes" value="${esc(o.note||'')}"></label>`,
   onOpen:f=>wireLines(f,true),
   onSubmit:f=>{const L=cleanLines(readLines(f)).map(l=>({...l,carton:0}));if(!L.length&&!(o.taps||[]).length){toast('Aucune ligne');return false}
     const {b,miss}=makeBl({taps:(o.taps||[]).slice(),dateReprise:o.dateReprise||'',clientId:o.clientId||(c||{}).id||'',client:c?c.nom:o.client||'',date:f.elements.date.value||today(),adresse:f.elements.adresse.value.trim(),notes:f.elements.notes.value.trim(),lines:L,orderId:o.id});
     o.status='done';o.blId=b.id;save();toast(b.ref+' créé'+(miss.length?' · stock insuffisant : '+miss.join(', '):''));setTimeout(()=>go('/bl/'+b.id),0)}})}

/* --- BL --- */
V.bl=()=>{if(R.a)return blDoc(byId('bls',R.a));const q=norm(ui.bq||'');
  const L=coll('bls').filter(b=>!q||norm([b.ref,b.client,(clientOf(b)||{}).nom].join(' ')).includes(q)).sort((a,b)=>(a.date+a.ref)<(b.date+b.ref)?1:-1);
  return `<div class="head"><div><div class="kicker">${coll('bls').length} bon(s) de livraison</div><h1>Bons de livraison</h1></div><div class="actions"><button class="btn" data-act="newBl">BL sans commande</button><a class="btn pri" href="#/commandes">Commandes à livrer</a></div></div>
  <input id="bq" placeholder="Rechercher un n° de BL ou un client…" value="${esc(ui.bq||'')}" style="margin-bottom:12px">
  ${L.length?`<div class="rows">${L.slice(0,200).map(b=>`<div class="row click" data-href="#/bl/${b.id}"><div class="main"><b>${esc(b.ref)} · ${esc((clientOf(b)||{}).nom||b.client||'—')}</b><span class="small muted">${fD(b.date)} · ${linesTxt(b.lines)}</span></div>${b.status==='signe'?'<span class="badge ok">Signé</span>':'<span class="badge blue">En attente</span>'}</div>`).join('')}</div>`
   :emptyBox(coll('bls').length?'Aucun résultat':'Aucun bon de livraison','Un BL se crée en un clic quand tu livres une commande. Il sort les bouteilles et fûts du stock et s\'imprime.')}`};
V.bl.after=()=>{const q=$('#bq');if(q)q.oninput=()=>{ui.bq=q.value;const p=q.selectionStart;render();const n=$('#bq');n.focus();n.setSelectionRange(p,p)}};
function blDoc(b){if(!b)return emptyBox('BL introuvable','','<a class="btn" href="#/bl">Retour aux BL</a>');const c=clientOf(b)||{};const co=S.company||{};
  return `<div class="head noprint"><div><a class="small muted" href="#/bl" style="text-decoration:none">← Bons de livraison</a><h1>${esc(b.ref)}</h1></div><div class="actions">
   ${b.status==='signe'?'<button class="btn" data-act="blSign" data-id="'+b.id+'">Remettre en attente</button>':'<button class="btn" data-act="blSign" data-id="'+b.id+'">Marquer signé</button>'}${(b.lines||[]).some(l=>l.format&&num(l.qty)>0)?`<button class="btn" data-act="blRet" data-id="${b.id}">Reprise non consommé</button>`:''}<button class="btn danger" data-act="blDel" data-id="${b.id}">Supprimer</button><button class="btn pri" data-act="print">Imprimer</button></div></div>
  <div class="doc"><div class="doc-top"><div><h2 style="font-size:20px">${esc(co.nom||S.brewery||'Ma brasserie')}</h2><div class="small">${[co.adresse,[co.cp,co.ville].filter(Boolean).join(' '),co.tel,co.email,co.siret?'SIRET '+co.siret:''].filter(Boolean).map(esc).join('<br>')}</div></div>
   <div style="text-align:right"><div style="font-size:22px;font-weight:800">Bon de livraison</div><div>N° <b>${esc(b.ref)}</b></div><div>Date : ${new Date(b.date+'T12:00:00').toLocaleDateString('fr-FR')}</div>${b.orderId&&byId('orders',b.orderId)?.num?`<div class="small muted">Commande ${esc(byId('orders',b.orderId).num)}</div>`:''}</div></div>

/* reprise des fûts / bouteilles non consommés : ligne négative sur le BL + retour en stock */
function blRetLines(b){const key=l=>norm(l.beer)+'|'+l.format+'|'+(l.lot||'');const back={};
  (b.lines||[]).filter(l=>l.format&&num(l.qty)<0).forEach(l=>{back[key(l)]=(back[key(l)]||0)-lineQty(l)});
  const out=[];(b.lines||[]).filter(l=>l.format&&num(l.qty)>0).forEach(l=>{const k=key(l);const liv=lineQty(l);const deja=Math.min(liv,back[k]||0);back[k]=(back[k]||0)-deja;out.push({beer:l.beer,format:l.format,lot:l.lot||'',liv,deja,dispo:liv-deja})});return out}
function blRetForm(b){const L=blRetLines(b);
  openDlg({title:'Reprise · '+esc(b.ref),submit:'Remettre en stock',body:`
   <p class="small muted">Saisis ce que le client te rend sans l'avoir consommé. Une ligne « Retour » est ajoutée au BL et les bouteilles ou fûts reviennent dans le stock, sur le même lot.</p>
   <label class="f">Date du retour<input type="date" name="date" value="${today()}"></label>
   <div class="rows">${L.map((l,i)=>`<div class="row"><div class="main"><b>${esc(l.beer)}</b><span class="small muted">${esc(fmtOf(l.format)[1])} · ${l.lot?'lot '+esc(l.lot)+' · ':''}livré ${fN(l.liv)}${l.deja?' · déjà repris '+fN(l.deja):''} · reprenable ${fN(l.dispo)}</span></div><input type="number" inputmode="numeric" min="0" max="${l.dispo}" step="1" name="r${i}" placeholder="0" style="width:76px;text-align:center" ${l.dispo?'':'disabled'}></div>`).join('')}</div>`,
   onSubmit:f=>{const date=f.elements.date.value||today();let n=0;const add=[];
     L.forEach((l,i)=>{const q=Math.max(0,Math.min(l.dispo,Math.round(num(f.elements['r'+i].value))));if(!q)return;n+=q;
       add.push({beer:l.beer,format:l.format,qty:-q,carton:0,lot:l.lot,label:'Retour — '+l.beer+' — '+fmtOf(l.format)[1],retDate:date});
       const lot=String(l.lot||'').split(', ')[0];let t=stk().find(x=>norm(x.beer)===norm(l.beer)&&x.format===l.format&&(x.lot||'')===lot);
       if(!t){t={id:uid(),beer:l.beer,format:l.format,qty:0,lot,date:b.date};stk().push(t)}t.qty=num(t.qty)+q;stockMove(t,q,'Retour client '+b.ref)});
     if(!n){toast('Aucune quantité saisie');return false}

/* --- import Hexagone : clients, commandes, BL, infos brasserie --- */
const HX_FMT_TXT=[[/30\s*l.*inox/i,'fut30inox'],[/kktp/i,'fut30kktp'],[/30\s*l.*kk|keykeg/i,'fut30kk'],[/20\s*l/i,'fut20'],[/75\s*c?l/i,'btl75'],[/44\s*c?l/i,'btl44'],[/33\s*c?l|bouteille|carton/i,'btl33']];
function hxParseDesignation(d,unite){let t=String(d||'').replace(/^Retour — /,'');const parts=t.split(' — ');const beer=parts[0].trim();const rest=(parts.slice(1).join(' ')||'')+' '+(unite||'');
  const m=HX_FMT_TXT.find(([re])=>re.test(rest));return{beer,format:m?m[1]:(/f[uû]t/i.test(rest)?'fut30inox':'')}}
function hexagoneSales(j){if(!j||!(j.clients||j.orders||j.bl))return null;
  const clients=hxArr(j.clients).filter(c=>c.nom).map(c=>({hx:String(c.id||c.nom),nom:String(c.nom).trim(),type:c.type&&CTYPES.includes(c.type)?c.type:(c.type||''),contact:c.contact||'',tel:c.tel||'',email:c.email||'',adresse:c.adresse||'',cp:c.cp||'',ville:c.ville||'',siret:c.siret||'',notes:c.notes||''}));
  const orders=[];Object.entries(j.orders||{}).forEach(([date,list])=>hxArr(list).forEach(o=>{if(!o||!o.client)return;const L=[];
    (o.lines||[]).forEach(l=>{if(!l||!l.beer)return;['fut30inox','fut30kk','fut30kktp','fut20'].forEach(k=>{if(num(l[k])>0)L.push({beer:l.beer,format:k,qty:num(l[k]),carton:0})});
      if(num(l.cartons)>0){const sp=/peux pas/i.test(l.beer);L.push({beer:l.beer,format:sp?'btl44':'btl33',qty:num(l.cartons),carton:sp?24:12})}});
    const tl=hxArr(o.tireuseLines).map(x=>String(x.tireuseId||'')).filter(Boolean);
    if(L.length||tl.length)orders.push({hxTaps:tl,dateReprise:hxDay(o.dateReprise)||'',hx:String(o.id||date+o.client),client:String(o.client).trim(),date:hxDay(date)||date,note:o.note||'',lines:L,status:(hxDay(date)||date)<today()?'done':'todo'})}));
  const bls=hxArr(j.bl).filter(b=>b&&b.client).map(b=>({hx:String(b.id),ref:b.ref||'BL-'+b.id,client:String(b.client).trim(),date:hxDay(b.date)||hxDay(b.ts)||today(),adresse:b.adresse||'',notes:b.notes||'',status:b.statut==='signe'?'signe':'attente',stockDone:true,
    lines:(b.lines||[]).filter(l=>l&&(l.designation||l.qte)).map(l=>{const p=hxParseDesignation(l.designation,l.unite);return p.format?{beer:p.beer,format:p.format,qty:num(l.qte),carton:0,lot:l.lotRef||'',label:/^Retour/.test(l.designation||'')?l.designation:''}:{label:l.designation||'',qty:num(l.qte),unite:l.unite||'',lot:l.lotRef||''}})}));
  const co=j.params&&j.params.brasserie||null;
  const tps=hxArr(j.tireuses).map(t=>({hx:String(t.id),name:'Tireuse '+(t.num||t.id),brand:t.modele||''}));
  return{clients,orders,bls,co,tps}}
function hexagoneSalesDialog(j){const D=hexagoneSales(j);if(!D)return toast('Ce n\'est pas une sauvegarde Hexagone');
  const todo=D.orders.filter(o=>o.status==='todo');
  openDlg({title:'Clients, commandes et BL d\'Hexagone',submit:'Importer',body:`<div class="rows">
   <div class="row"><div class="main"><b>${D.clients.length} client(s)</b><span class="small muted">${D.clients.slice(0,6).map(c=>esc(c.nom)).join(', ')}${D.clients.length>6?'…':''}</span></div></div>
   <div class="row"><div class="main"><b>${D.orders.length} commande(s)</b><span class="small muted">${todo.length} à livrer (date d'aujourd'hui ou plus tard), ${D.orders.length-todo.length} passées, rangées dans « Livrées »</span></div></div>
   <div class="row"><div class="main"><b>${D.bls.length} BL</b><span class="small muted">gardés avec leur numéro ; le stock n'est pas touché (c'est déjà fait dans Hexagone)</span></div></div>
   ${(D.tps||[]).length?`<div class="row"><div class="main"><b>${D.tps.length} tireuse(s)</b><span class="small muted">ajoutées dans Équipement, avec leurs prêts dans les commandes</span></div></div>`:''}
   ${D.co&&D.co.nom?`<div class="row"><div class="main"><b>Infos de la brasserie</b><span class="small muted">${esc([D.co.nom,D.co.ville].filter(Boolean).join(', '))} : en-tête des BL</span></div></div>`:''}</div>
   <p class="small muted">Un élément déjà importé est mis à jour, pas dupliqué.</p>`,
   onSubmit:()=>{const byName={};const tapMap={};
     (D.tps||[]).forEach(t=>{let e=S.equipment.find(x=>x.type==='tireuse'&&(x.hx===t.hx||norm(x.name)===norm(t.name)));if(e)Object.assign(e,t);else{e={id:uid(),type:'tireuse',...t};S.equipment.push(e)}tapMap[t.hx]=e.id});
     D.clients.forEach(o=>{let c=coll('clients').find(x=>x.hx===o.hx)||coll('clients').find(x=>norm(x.nom)===norm(o.nom));if(c)Object.assign(c,o);else{c={id:uid(),...o};coll('clients').push(c)}byName[norm(c.nom)]=c});
     const cl=nm=>{let c=byName[norm(nm)]||coll('clients').find(x=>norm(x.nom)===norm(nm));if(!c){c={id:uid(),nom:nm,type:''};coll('clients').push(c)}byName[norm(nm)]=c;return c};
     D.orders.forEach(o=>{const c=cl(o.client);const ex=coll('orders').find(x=>x.hx===o.hx);const d={...o,clientId:c.id,client:c.nom,taps:(o.hxTaps||[]).map(h=>tapMap[h]).filter(Boolean),tapBack:o.status==='done'?(o.dateReprise||o.date):''};delete d.hxTaps;if(ex)Object.assign(ex,{...d,status:ex.status==='todo'?d.status:ex.status});else coll('orders').push({id:uid(),num:'',...d})});
     D.bls.forEach(b=>{const c=cl(b.client);const ex=coll('bls').find(x=>x.hx===b.hx);const d={...b,clientId:c.id,client:c.nom};if(ex)Object.assign(ex,d);else coll('bls').push({id:uid(),...d})});
     if(D.co&&D.co.nom){S.company={...(S.company||{}),...D.co};if(!S.brewery)S.brewery=D.co.nom}
     save();go('/commandes');toast(`${D.clients.length} client(s), ${D.orders.length} commande(s), ${D.bls.length} BL`)}})}

let TM=null;try{TM=JSON.parse(lsGet('brassage.timer'))}catch(e){}
function startTimer(min,label,adds){TM={end:Date.now()+min*60000,total:min,label,adds:(adds||[]).map(a=>({...a,done:false}))};lsSet('brassage.timer',JSON.stringify(TM));renderTimer();toast('Minuteur lancé : '+min+' min')}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.25,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.2)})}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}}
function renderTimer(){const box=$('#timerbox');if(!TM){box.innerHTML='';return}const left=Math.max(0,TM.end-Date.now());const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);const leftMin=left/60000;
  let next=TM.adds.filter(a=>!a.done).sort((a,b)=>b.at-a.at)[0];let alarm=left===0;
  if(next&&leftMin<=next.at){next.done=true;lsSet('brassage.timer',JSON.stringify(TM));beep();toast('Ajouter maintenant : '+next.label);alarm=true}
  if(left===0&&!TM.rang){TM.rang=true;lsSet('brassage.timer',JSON.stringify(TM));beep()}
  next=TM.adds.filter(a=>!a.done).sort((a,b)=>b.at-a.at)[0];
  box.innerHTML=`<div class="timer ${alarm?'alarm':''}"><div><div class="small" style="opacity:.8">${esc(TM.label)}${next?' · prochain ajout à '+next.at+' min : '+esc(next.label):''}</div><b>${left===0?'Terminé !':String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}</b></div><button class="btn sm" data-act="stopTimer">${left===0?'OK':'Arrêter'}</button></div>`}
setInterval(()=>{if(TM)renderTimer()},1000);
